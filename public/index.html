<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GX Proxy Search</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <div class="browser-shell">
      <header class="browser-header">
        <div class="window-controls" aria-label="window controls">
          <span class="dot red"></span>
          <span class="dot yellow"></span>
          <span class="dot green"></span>
        </div>

        <div class="address-bar-wrap">
          <div class="browser-pill">GX Browser</div>
          <div class="address-bar">
            <span class="url-lock">🔒</span>
            <span>proxysearch.local</span>
          </div>
        </div>

        <div class="header-tools">
          <button class="tool-button" aria-label="favorite">★</button>
          <button class="tool-button" aria-label="settings">⚙</button>
        </div>
      </header>

      <main class="browser-body">
        <aside class="sidebar">
          <div class="nav-title">Quick Access</div>
          <button class="nav-item active">Search</button>
          <button class="nav-item">News</button>
          <button class="nav-item">Gaming</button>
          <button class="nav-item">AI</button>
          <button class="nav-item">Tools</button>
        </aside>

        <section class="content-panel">
          <div class="brand-row">
            <div class="brand-badge">GX</div>
            <div>
              <p class="eyebrow">Proxy search browser</p>
              <h1>Opera GX-inspired search</h1>
            </div>
          </div>

          <form id="search-form" class="search-bar">
            <span class="search-icon">⌕</span>
            <input
              id="query-input"
              type="text"
              placeholder="Search the web..."
              aria-label="Search the web"
              autocomplete="off"
              required
            />
            <button type="submit">Search</button>
          </form>

          <div class="quick-links" aria-label="quick search suggestions">
            <button class="suggestion" data-query="open source projects">Open Source</button>
            <button class="suggestion" data-query="AI tools 2026">AI Tools</button>
            <button class="suggestion" data-query="best coding workflows">Coding Workflows</button>
            <button class="suggestion" data-query="color palette inspiration">Design</button>
          </div>

          <section class="status-panel" id="status-panel" aria-live="polite">
            Ready to search.
          </section>

          <section class="results" id="results" aria-live="polite"></section>
        </section>
      </main>
    </div>

    <script src="/app.js"></script>
  </body>
</html>
