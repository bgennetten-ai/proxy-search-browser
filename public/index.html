<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Proxy Search Browser</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <div class="shell">
      <header class="topbar">
        <div class="brand-group">
          <div class="brand-mark">P</div>
          <div>
            <h1>Proxy Search Browser</h1>
            <p>Search through a local proxy endpoint</p>
          </div>
        </div>
      </header>

      <main class="content">
        <form id="search-form" class="search-bar">
          <input
            id="query-input"
            type="text"
            placeholder="Search the web..."
            aria-label="Search the web"
            autocomplete="off"
            required
          />
          <button type="submit">Search</button>
        </form>

        <div class="quick-links" aria-label="quick search suggestions">
          <button class="suggestion" data-query="open source projects">Open Source</button>
          <button class="suggestion" data-query="AI tools 2026">AI Tools</button>
          <button class="suggestion" data-query="best coding workflows">Coding Workflows</button>
          <button class="suggestion" data-query="weather in san francisco">Weather</button>
        </div>

        <section class="status-panel" id="status-panel" aria-live="polite">
          Ready to search.
        </section>

        <section class="results" id="results" aria-live="polite"></section>
      </main>
    </div>

    <script src="/app.js"></script>
  </body>
</html>
